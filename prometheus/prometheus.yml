global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gitea'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gitea:3000']
  
  - job_name: 'flask'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flask:5000']
